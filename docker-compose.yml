# Zahi Connect - Docker Compose
# Local development stack for the Zahi microservice architecture.

services:
  # Database
  db:
    image: postgres:15
    container_name: zahi_db
    environment:
      - POSTGRES_DB=zahi_connect_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache and sessions
  redis:
    image: redis:alpine
    container_name: zahi_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: zahi_dynamodb_local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: zahi_chromadb
    ports:
      - "8007:8000"
    volumes:
      - chroma_data:/chroma/chroma

  accounts:
    build: ./services/accounts
    container_name: zahi_accounts
    volumes:
      - ./services/accounts:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./services/accounts/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  hotel:
    build: ./services/hotel
    container_name: zahi_hotel
    volumes:
      - ./services/hotel:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8002 --reload --reload-dir /app"
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./services/hotel/.env
    depends_on:
      db:
        condition: service_healthy

  restaurant:
    build: ./services/restaurant
    container_name: zahi_restaurant
    volumes:
      - ./services/restaurant:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8003 --reload --reload-dir /app"
    restart: always
    ports:
      - "8003:8003"
    env_file:
      - ./services/restaurant/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mobility:
    build: ./services/mobility
    container_name: zahi_mobility
    volumes:
      - ./services/mobility:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8004 --reload --reload-dir /app"
    restart: always
    ports:
      - "8004:8004"
    depends_on:
      db:
        condition: service_healthy

  flight:
    build: ./services/flight
    container_name: zahi_flight
    volumes:
      - ./services/flight:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8005 --reload --reload-dir /app"
    restart: always
    ports:
      - "8005:8005"
    env_file:
      - ./services/flight/.env
    depends_on:
      db:
        condition: service_healthy

  ai_service:
    build: ./services/ai_service
    container_name: zahi_ai_service
    volumes:
      - ./services/ai_service:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8006 --reload --reload-dir /app"
    restart: always
    ports:
      - "8006:8006"
    env_file:
      - ./services/ai_service/.env
    depends_on:
      restaurant:
        condition: service_started
      dynamodb-local:
        condition: service_started
      chromadb:
        condition: service_started

  booking:
    build: ./services/booking
    container_name: zahi_booking
    volumes:
      - ./services/booking:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8008"
    restart: always
    ports:
      - "8008:8008"
    env_file:
      - ./services/booking/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/booking', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: zahi_gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
      # Future: mount frontend build here
      # - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "8080:80"
    restart: always
    depends_on:
      accounts:
        condition: service_started
      hotel:
        condition: service_started
      restaurant:
        condition: service_started
      mobility:
        condition: service_started
      flight:
        condition: service_started
      ai_service:
        condition: service_started
      booking:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
  dynamodb_data:
